<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tirar Foto</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 20px;
    }

    .camera-box {
      width: 200px;
      height: 200px;
      border: 3px dashed #aaa;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: #fff;
    }

    .camera-icon {
      font-size: 60px;
    }

    #preview {
      margin-top: 20px;
      max-width: 90%;
      border-radius: 10px;
      display: none;
    }

    button {
      margin-top: 15px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    #send-btn {
      background: #007bff;
      color: white;
      display: none;
    }

    #whatsapp-btn {
      background: #25d366;
      color: white;
      display: none;
    }

    #loading {
      margin-top: 10px;
      display: none;
      color: #555;
    }

    input[type="file"] {
      display: none;
    }
  </style>
</head>

<body>
  <h1>📸 Tire sua foto</h1>

  <div class="camera-box" id="cameraBox">
    <span class="camera-icon">📷</span>
  </div>

  <input
    type="file"
    accept="image/*"
    capture="environment"
    id="cameraInput"
  />

  <img id="preview">

  <button id="send-btn">Enviar para o evento</button>
  <button id="whatsapp-btn">Enviar pelo WhatsApp</button>

  <div id="loading">Enviando foto...</div>

  <script>
    const cameraBox = document.getElementById('cameraBox');
    const cameraInput = document.getElementById('cameraInput');
    const preview = document.getElementById('preview');
    const sendBtn = document.getElementById('send-btn');
    const whatsappBtn = document.getElementById('whatsapp-btn');
    const loading = document.getElementById('loading');

    // 🔑 SUPABASE
    const SUPABASE_URL = "https://czhtdbjkscsqsrgawobg.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6aHRkYmprc2NzcXNyZ2F3b2JnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI3OTg4NjQsImV4cCI6MjA3ODM3NDg2NH0.yPH_BrOGNbf-tZMx2zk0_xEcm0K9fyhUo2A8Ug6i3ms";
    

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // 📸 Abrir câmera
    cameraBox.addEventListener('click', () => {
      cameraInput.click();
    });

    // 👀 Preview
    cameraInput.addEventListener('change', () => {
      const file = cameraInput.files[0];
      if (!file) return;

      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      sendBtn.style.display = 'inline-block';
      whatsappBtn.style.display = 'inline-block';
    });

    // ☁️ Enviar para Supabase
    sendBtn.addEventListener('click', async () => {
      const file = cameraInput.files[0];
      if (!file) return;

      sendBtn.style.display = 'none';
      whatsappBtn.style.display = 'none';
      loading.style.display = 'block';

      const fileName = `${Date.now()}.jpg`;

      const { error } = await supabaseClient.storage
        .from('fotos-convidados')
        .upload(fileName, file, {
          contentType: file.type,
          upsert: false
        });

      loading.style.display = 'none';

      if (error) {
        console.error(error);
        alert('Erro ao enviar a foto');
        sendBtn.style.display = 'inline-block';
        whatsappBtn.style.display = 'inline-block';
      } else {
        alert('Foto enviada com sucesso 🎉');
        resetar();
      }
    });

    // 📲 Enviar pelo WhatsApp
    whatsappBtn.addEventListener('click', () => {
      const texto = encodeURIComponent(
        'Oi! Segue minha foto do evento 📸'
      );

      window.open(
        `https://wa.me/5511947853999?text=${texto}`,
        '_blank'
      );
    });

    function resetar() {
      preview.style.display = 'none';
      cameraInput.value = '';
      sendBtn.style.display = 'none';
      whatsappBtn.style.display = 'none';
    }
  </script>
</body>
</html>
